<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content | SGA Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body data-admin="content">

<div class="signin admin-gate" id="signin">
  <div class="container">
    <h1>SGA Admin</h1>
    <p>Sign in with your officer account.</p>
    <div id="gate-note"></div>
    <form class="form" id="signin-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <p class="form-status" id="signin-status" hidden></p>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p style="margin-top: var(--sp-6); font-family: var(--font-ui); font-size: var(--fs-sm);">
      <a href="../index.html">Back to the site</a>
    </p>
  </div>
</div>

<div class="admin-gate" id="console">
  <div class="admin-bar">
    <div class="container admin-bar__inner">
      <a class="admin-bar__brand" href="index.html">SGA<span>Admin</span></a>
      <ul class="admin-nav">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="content.html?type=news">News</a></li>
        <li><a href="content.html?type=minutes">Minutes</a></li>
        <li><a href="content.html?type=people">Officers</a></li>
        <li><a href="content.html?type=documents">Documents</a></li>
        <li><a href="content.html?type=instagram">Instagram</a></li>
        <li><a href="content.html?type=clubs">Clubs</a></li>
        <li><a href="inbox.html?type=feedback">Feedback</a></li>
        <li><a href="inbox.html?type=club_submissions">Submissions</a></li>
        <li><a href="inbox.html?type=funding_requests">Funding</a></li>
      </ul>
      <div class="admin-bar__right">
        <span class="admin-who" id="who"></span>
        <button class="btn btn--sm btn--light" id="signout" type="button">Sign out</button>
      </div>
    </div>
  </div>

  <main class="admin-main">
    <div class="container">
      <div class="admin-head">
        <div>
          <h1 id="page-title">Content</h1>
          <p>Drafts stay invisible on the site until you publish them.</p>
        </div>
        <button class="btn btn--sm" id="new" type="button">New</button>
      </div>

      <section class="editor" id="editor" hidden>
        <h2 id="editor-title">Edit</h2>
        <div class="grid-fields grid-fields--2" id="editor-fields"></div>
        <div class="actions">
          <button class="btn" id="save" type="button">Save</button>
          <button class="btn btn--ghost" id="cancel" type="button">Cancel</button>
        </div>
      </section>

      <div class="rows" id="rows"></div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/vendor/supabase.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
